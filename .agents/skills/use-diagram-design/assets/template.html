<!DOCTYPE html>
<!-- Offline AgentBase profile adapted from the pinned MIT Diagram Design template. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentBase Diagram</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: Georgia, "Times New Roman", serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    body { background: var(--paper); color: var(--ink); font-family: var(--sans); min-height: 100vh; padding: 3rem 2rem; }
    main { margin: auto; max-width: 1200px; }
    .eyebrow { color: var(--muted); font-family: var(--mono); font-size: .66rem; letter-spacing: .18em; margin-bottom: .5rem; text-transform: uppercase; }
    h1 { font-family: var(--serif); font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 400; margin-bottom: 1.5rem; }
    svg { display: block; min-width: 900px; width: 100%; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">AgentBase · Published Hub</p>
    <h1>[Diagram title]</h1>
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">[Diagram title]</title>
      <desc id="diagram-desc">[One sentence describing the Published Hub selection]</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <!-- Draw groups, connectors, then nodes. -->
    </svg>
  </main>
</body>
</html>
